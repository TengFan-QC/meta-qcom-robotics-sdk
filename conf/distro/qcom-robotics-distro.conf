require conf/distro/qcom-auto-distro.conf
require conf/distro/include/qcom-robotics-sdk.inc

DISTRO_NAME = "Qualcomm Linux Robotics Distro with ROS"

DISTRO_FEATURES:append = " ros2-jazzy"

# qcom-robotics-image / qcom-robotics-proprietary-image are for qcom-distro and
# require qcom-multimedia*-image.bb from meta-qcom-distro, which is not part of
# the auto stack; a missing require halts parsing of all recipes. Mask them
# here and use robotics-machine-image on the auto stack instead.
BBMASK += "meta-qcom-robotics-sdk/recipes-products/images/qcom-robotics-image\.bb$"
BBMASK += "meta-qcom-robotics-sdk/recipes-products/images/qcom-robotics-proprietary-image\.bb$"

# QIRP SDK samples/packagegroups need meta-ai (tensorflow-lite, qairt-sdk),
# which is not part of the auto stack.
QIRP_SDK_ENABLED = "0"

# auto security_flags.inc (picked up via BBPATH by oe-core defaultsetup.conf,
# after this file) forces "-pie -fPIE" into SECURITY_CFLAGS for every recipe;
# it lands after the -fPIC CMake adds for shared libs, so ROS shared libs /
# plugins / pybind11 extensions get PIE relocations and fail to link.
# The oe-core toolchain already defaults to PIE executables (GCCPIE), so keep
# the other hardening flags and drop only the explicit -pie -fPIE. Use :remove
# since a plain assignment here would be overridden by the later include.
SECURITY_CFLAGS:remove = "-pie -fPIE"

# Robotics packages not ready on the auto stack yet. Removed here rather than
# in the packagegroups so qcom-distro keeps the full lists. RDEPENDS of a
# packagegroup belongs to the packagegroup recipe, so this cannot be done from
# an image recipe.
#   qrb-ros-nn-inference: qairt/qnn not ready
RDEPENDS:packagegroup-robotics-opensource:remove = "qrb-ros-nn-inference"
#   camera/gpu/video/audio not ready; sample-apriltag RDEPENDS on
#   qrb-ros-camera / qrb-ros-colorspace-convert
RDEPENDS:packagegroup-oss-with-prop-deps:remove = " \
    qrb-colorspace-convert-lib \
    qrb-ros-colorspace-convert \
    qrb-ros-camera \
    qrb-ros-video \
    qrb-ros-audio-service \
    sample-apriltag \
"

# Remaining GPLv3 runtime deps, allowed into robotics-machine-image only:
#   bash      <- opencv-apps, hdf5 (h5fuse.sh), moveit-kinematics (ikfast script)
#   elfutils  <- backward-ros (stack traces)
#   gdb, gdbserver, mpfr <- packagegroup-qti-debug (VARIANT=debug)
#   readline  <- lua <- cartographer
#   mavros-msgs <- xsens-mti-ros2-driver
#   babeltrace2, binutils, coreutils, findutils, gawk, gnutls, kbd,
#   libbfd, libidn2, libopcodes, libtasn1 <- moveit-ros-perception-dev,
#                                            moveit-planners-ompl-dev
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-robotics-machine-image = " \
    bash:GPL-3.0-or-later \
    bash-dev:GPL-3.0-or-later \
    elfutils:GPL-3.0-or-later \
    elfutils-dev:GPL-3.0-or-later \
    gdb:GPL-3.0-only gdb:LGPL-3.0-only \
    gdbserver:GPL-3.0-only gdbserver:LGPL-3.0-only \
    mpfr:LGPL-3.0-or-later \
    mpfr-dev:LGPL-3.0-or-later \
    readline:GPL-3.0-or-later \
    readline-dev:GPL-3.0-or-later \
    mavros-msgs:GPL-3.0-only mavros-msgs:LGPL-3.0-only \
    babeltrace2:GPL-3.0-or-later \
    babeltrace2-dev:GPL-3.0-or-later \
    binutils:GPL-3.0-only \
    binutils-dev:GPL-3.0-only \
    libbfd:GPL-3.0-only \
    libopcodes:GPL-3.0-only \
    coreutils:GPL-3.0-or-later \
    coreutils-dev:GPL-3.0-or-later \
    coreutils-stdbuf:GPL-3.0-or-later \
    findutils:GPL-3.0-or-later \
    findutils-dev:GPL-3.0-or-later \
    gawk:GPL-3.0-or-later \
    gawk-dev:GPL-3.0-or-later gawk-dev:AGPL-3.0-or-later \
    gnutls-dev:GPL-3.0-or-later \
    gnutls-openssl:GPL-3.0-or-later \
    kbd-dev:GPL-3.0-or-later \
    libidn2-dev:GPL-3.0-or-later \
    libtasn1-dev:GPL-3.0-or-later \
"
# license-exception is in ERROR_QA by default, which would still fail do_rootfs
# for packages allowed above; report them as warnings instead.
ERROR_QA:remove:pn-robotics-machine-image = "license-exception"
WARN_QA:append:pn-robotics-machine-image = " license-exception"
